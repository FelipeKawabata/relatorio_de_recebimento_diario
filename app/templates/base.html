<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<header>
    <div id="id_header" class="container-fluid">

        <div class="row" id="id_top_row_header">
            <div class="col-6 px-2">
                <h1>RDR - Controle de recebimento diário</h1>
            </div>

            <div class="col-6 text-end">
                <img
                    src="{{ url_for('static', filename='img/logo_ia_branco.png') }}"
                    alt="Logo Interativa"
                    id="id_logo_ia_header"
                >
            </div>
        </div>

        <div class="row" id="id_under_row_header">
            <div class="col-auto p-1 m-0">
                <a href="{{ url_for('homepage') }}" class="class_link_button">
                    Página inicial
                </a>  
            </div>

            <div class="col-auto p-1 m-0">
                <a class="class_link_button" href="{{ url_for('categorias') }}">
                    Gerenciar categorias
                </a>
            </div>
            <div class="col-auto p-0 m-0 ms-auto">
                <div class="d-flex align-items-center" id="id_div_botao_logout">
                    <a href="{{ url_for('logout' )}}" class="class_botao_logout">Logout</a>
                    <img src="{{ url_for('static',filename='img/logo_sair.svg')}}" alt="Icone sair" id="id_icone_sair_header">
                </div>
            </div>
        </div>

    </div>
</header>

{% block content %}
{% endblock %}

<foot id="footer">
    <p class="footer_text">Aplicação criada para controle diário dos recebimentos de fornecedores</p>
    <p class="footer_text">Uso exclusivo interno da Interativa</p>
</foot>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
