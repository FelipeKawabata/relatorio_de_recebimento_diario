<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body id="body_login">


<div class="container mt-5" style="max-width: 600px;" id="div_container_login">
    <div class="row w-100">
        <div class="col-12 d-flex justify-content-center mb-3">
            <img src="{{ url_for('static',filename='img/fotoIA.jpg') }}" alt="Logo Interativa" id="img_IA_login">
        </div>
        
        <div class="col-12 text-center">
            <h2 class="text-center">Relatório de recebimento diário</h2>
            {% with mensagens = get_flashed_messages() %}
                {% for m in mensagens %}
                    <div class="alert alert-danger">{{ m }}</div>
                {% endfor %}
            {% endwith %}
            <form method="post">
                <input class="form-control mb-2" type="text" name="usuario" placeholder="Usuário Protheus" required>
                <input class="form-control mb-2" type="password" name="senha" placeholder="Senha" required>
                <button class="btn btn-primary w-50 text-center" type="submit" id="id_login_button">Entrar</button>
                <div class="container mt-2 text-center" id="id_container_aviso_protheus">O login deve ser feito com usuário e senha do Protheus</div>
            </form>
        </div>
    </div>
</div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
